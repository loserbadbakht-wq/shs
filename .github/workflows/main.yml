name: Fetch RSS and convert to JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Fetch and convert RSS feeds
        run: |
          mkdir -p json
          npm init -y
          npm install axios xml2js
          
          cat > convert.js << 'EOF'
          const axios = require('axios');
          const xml2js = require('xml2js');
          const fs = require('fs');
          const parser = new xml2js.Parser({ explicitArray: false });
          
          // Define your RSS feeds here
          const feeds = [
            {
              url: 'https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/safebooru/safebooru-yuri-rss.xml',
              filename: 'safebooru-yuri-rss.json'
            },
            // Add more feeds here
             {
              url: 'https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/notif/new1.xml',
              filename: 'new1.json'
             },
            // {
            //   url: 'https://example.com/feed3.xml',
            //   filename: 'feed3.json'
            // }
          ];
          
          async function fetchAndConvert(feed) {
            try {
              console.log(`Fetching: ${feed.url}`);
              const response = await axios.get(feed.url);
              const result = await parser.parseStringPromise(response.data);
              const jsonPath = `json/${feed.filename}`;
              fs.writeFileSync(jsonPath, JSON.stringify(result, null, 2));
              console.log(`✅ Saved: ${jsonPath}`);
            } catch (error) {
              console.error(`❌ Error processing ${feed.url}:`, error.message);
            }
          }
          
          async function processAllFeeds() {
            const promises = feeds.map(feed => fetchAndConvert(feed));
            await Promise.all(promises);
            console.log('All feeds processed!');
          }
          
          processAllFeeds();
          EOF
          
          node convert.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/
          git diff --staged --quiet || git commit -m "Update RSS feeds JSON [skip ci]"
          git push


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install googletrans
        run: pip install googletrans==4.0.0-rc1

      - name: Create translation script
        run: |
          cat > translate_feeds.py << 'EOF'
          import json
          import os
          import glob
          import time
          from googletrans import Translator

          # Folders – input: 'json' at repo root, output: 'json/translated'
          SOURCE_DIR = 'json'
          OUTPUT_DIR = 'json/translated'
          TARGET_LANG = os.getenv('TARGET_LANG', 'es')

          # Create output folder if it doesn't exist
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def translate_text(text, translator, retries=3):
              """Translate a text block with simple retry logic."""
              if not text or not isinstance(text, str):
                  return text
              for attempt in range(retries):
                  try:
                      result = translator.translate(text, dest=TARGET_LANG)
                      return result.text
                  except Exception as e:
                      print(f"  Translation error (attempt {attempt+1}): {e}")
                      time.sleep(2 ** attempt)
              return text  # fallback to original

          def translate_feed(data, translator):
              """Recursively translate title and description fields in RSS JSON."""
              # Handle channel level
              channel = data.get('rss', {}).get('channel', {})
              if channel:
                  if 'title' in channel:
                      print("  Translating channel title...")
                      channel['title'] = translate_text(channel['title'], translator)
                  if 'description' in channel:
                      print("  Translating channel description...")
                      channel['description'] = translate_text(channel['description'], translator)

                  # Handle items
                  items = channel.get('item', [])
                  for idx, item in enumerate(items):
                      print(f"  Translating item {idx+1}/{len(items)}...")
                      if 'title' in item:
                          item['title'] = translate_text(item['title'], translator)
                      if 'description' in item:
                          item['description'] = translate_text(item['description'], translator)
                      time.sleep(0.3)  # mild delay to avoid rate limits
              return data

          def main():
              # Check if source folder exists
              if not os.path.isdir(SOURCE_DIR):
                  print(f"Source folder '{SOURCE_DIR}' does not exist. Nothing to translate.")
                  return

              # Find all JSON files in the source folder
              json_files = glob.glob(os.path.join(SOURCE_DIR, '*.json'))
              if not json_files:
                  print(f"No JSON files found in '{SOURCE_DIR}'.")
                  return

              translator = Translator()

              for file_path in json_files:
                  filename = os.path.basename(file_path)
                  print(f"\n--- Processing: {filename} ---")

                  with open(file_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)

                  # Translate the feed
                  translated_data = translate_feed(data, translator)

                  # Save to output folder
                  output_path = os.path.join(OUTPUT_DIR, filename)
                  with open(output_path, 'w', encoding='utf-8') as f:
                      json.dump(translated_data, f, indent=2, ensure_ascii=False)

                  print(f"  ✅ Saved to: {output_path}")

              print("\nAll feeds translated successfully.")

          if __name__ == "__main__":
              main()
          EOF

      - name: Run translation
        env:
          TARGET_LANG: 'fa'   # change to 'fr', 'de', 'ja', etc.
        run: python translate_feeds.py

      - name: Commit and push translated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-translate RSS feeds"
          file_pattern: json/translated/*.json

      - name: Install dependencies
        run: pip install edge-tts requests

      - name: Generate TTS from all JSON files in json/
        run: |
          python - <<'EOF'
          import os, json, re, subprocess, glob

          out_dir = "json/tts"
          os.makedirs(out_dir, exist_ok=True)

          json_files = glob.glob("json/*.json")
          if not json_files:
              print("No JSON files found in json/")
              exit(0)

          def clean_text(text):
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', text)).strip()

          def sanitize_filename(title):
              # Remove only characters forbidden in filenames on Windows/Linux
              title = re.sub(r'[\\/*?:"<>|]', '', title)
              # Replace spaces and multiple underscores/dashes with a single underscore
              title = re.sub(r'[-\s]+', '_', title)
              # Remove any leading/trailing underscores or dots
              title = title.strip('_.')
              # Limit length to 200 characters (adjust as needed)
              return title[:200] or "untitled"

          for json_path in json_files:
              print(f"Processing {json_path}")
              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              items = data.get('rss', {}).get('channel', {}).get('item', [])
              if not items:
                  print(f"  No items in {json_path}, skipping.")
                  continue

              for idx, item in enumerate(items):
                  desc = item.get('description', '')
                  if not desc:
                      continue

                  title = item.get('title', f'item_{idx:03d}')
                  clean_title = sanitize_filename(title)
                  filename = os.path.join(out_dir, f"{clean_title}.mp3")

                  if os.path.exists(filename):
                      base, ext = os.path.splitext(filename)
                      filename = f"{base}_{idx}{ext}"

                  clean_desc = clean_text(desc)[:5000] + ("..." if len(desc) > 5000 else "")
                  subprocess.run([
                      "edge-tts", "--text", clean_desc,
                      "--write-media", filename,
                      "--voice", "en-US-JennyNeural"
                  ], check=True)
                  print(f"  Generated: {filename}")
          EOF

      - name: Commit and push audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add json/tts/*.mp3

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TTS audio files [skip ci]"
            git push origin HEAD:main
          fi
