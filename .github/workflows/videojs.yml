name: Inline Video.js into index.html

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inline-videojs
  cancel-in-progress: true

jobs:
  inline:
    if: github.actor != 'github-actions[bot]'   # loop guard #1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install @videojs/html esbuild

      - name: Build player.js
        run: |
          cat > entry.js <<'EOF'
          import '@videojs/html/video/player';
          import '@videojs/html/video/skin';
          import '@videojs/html/audio/player';
          import '@videojs/html/audio/skin';
          EOF
          npx esbuild entry.js \
            --bundle \
            --format=esm \
            --minify \
            --outfile=player.js

      - name: Inline player.js into index.html
        run: |
          cat > inline.js <<'EOF'
          const fs = require('fs');

          const player = fs.readFileSync('player.js', 'utf8');
          const html   = fs.readFileSync('index.html', 'utf8');

          // Prevent a literal </script> in the bundle from closing our block
          const safe = player.replace(/<\/script/gi, '<\\/script');

          const START = '<!-- @videojs-inline:start -->';
          const END   = '<!-- @videojs-inline:end -->';
          const block = `${START}\n<script type="module">\n${safe}\n</script>\n${END}`;

          const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const markerRe = new RegExp(esc(START) + '[\\s\\S]*?' + esc(END));

          let out;
          if (markerRe.test(html)) {
            // Re-run: swap the existing inline block in place
            out = html.replace(markerRe, block);
          } else {
            // First run: replace the CDN <script> tag
            const cdnRe = /<script\s+type="module"\s+src="https:\/\/cdn\.jsdelivr\.net\/npm\/@videojs\/cdn[^"]*"[^>]*>\s*<\/script>/;
            if (!cdnRe.test(html)) {
              console.error('✗ No Video.js CDN <script> tag and no inline markers found in index.html');
              process.exit(1);
            }
            out = html.replace(cdnRe, block);
          }

          if (out === html) {
            console.log('✓ index.html already up to date');
          } else {
            fs.writeFileSync('index.html', out);
            console.log('✓ Inlined player.js into index.html');
          }
          EOF
          node inline.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: inline videojs player into index.html [skip ci]"
          file_pattern: "player.js index.html"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
