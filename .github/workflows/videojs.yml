name: Build, Patch & Inline Video.js

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'   # loop guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install @videojs/html esbuild

      - name: Build player.js
        run: |
          cat > entry.js <<'EOF'
          import '@videojs/html/video/player';
          import '@videojs/html/video/skin';
          import '@videojs/html/audio/player';
          import '@videojs/html/audio/skin';
          EOF
          npx esbuild entry.js \
            --bundle \
            --format=esm \
            --minify \
            --outfile=player.js

      - name: Patch player.js — flip every side="top" to side="bottom"
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let player = fs.readFileSync('player.js', 'utf8');

          const topMatches = player.match(/side="top"/g) || [];
          console.log(`side="top" occurrences: ${topMatches.length}`);

          if (topMatches.length === 0) {
            console.log('✓ Nothing to patch — no side="top" in bundle');
            process.exit(0);
          }

          const count = topMatches.length;
          player = player.replace(/side="top"/g, 'side="bottom"');
          fs.writeFileSync('player.js', player);

          const remaining = (player.match(/side="top"/g) || []).length;
          if (remaining !== 0) {
            console.error(`✗ Post-replace check failed: ${remaining} side="top" still present`);
            process.exit(1);
          }
          console.log(`✓ Replaced ${count} side="top" → side="bottom"`);
          EOF

      - name: Inline player.js into index.html
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const player = fs.readFileSync('player.js', 'utf8');
          const html   = fs.readFileSync('index.html', 'utf8');

          const safe = player.replace(/<\/script/gi, '<\\/script');

          const START = '<!-- @videojs-inline:start -->';
          const END   = '<!-- @videojs-inline:end -->';
          const block = `${START}\n<script type="module">\n${safe}\n</script>\n${END}`;

          const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const markerRe = new RegExp(esc(START) + '[\\s\\S]*?' + esc(END));

          let out;
          if (markerRe.test(html)) {
            out = html.replace(markerRe, block);
          } else {
            const cdnRe = /<script\s+type="module"\s+src="https:\/\/cdn\.jsdelivr\.net\/npm\/@videojs\/cdn[^"]*"[^>]*>\s*<\/script>/;
            if (!cdnRe.test(html)) {
              console.error('✗ No Video.js CDN <script> and no inline markers in index.html');
              process.exit(1);
            }
            out = html.replace(cdnRe, block);
          }

          if (out === html) console.log('✓ index.html already up to date');
          else { fs.writeFileSync('index.html', out); console.log('✓ Inlined player.js into index.html'); }
          EOF

      - name: Patch index.html — player follows page theme toggle
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8');

          const MARKER = '<!-- @videojs-theme-fix -->';
          if (html.includes(MARKER)) {
            console.log('✓ Player theme-fix already present — skipping');
            process.exit(0);
          }

          if (!html.includes('</head>')) {
            console.error('✗ Could not find </head> in index.html');
            process.exit(1);
          }

          const styleBlock =
          MARKER + '\n' +
          '<style>\n' +
          '  /*\n' +
          '   * Video.js players follow the page theme toggle.\n' +
          '   *\n' +
          '   * The player uses `all: initial`, which resets color-scheme to\n' +
          '   * `normal` (light). That breaks inheritance of the page theme, so\n' +
          '   * the `light-dark()` values inside the skin never react to the\n' +
          '   * toggle. Forcing color-scheme to match data-theme fixes it.\n' +
          '   */\n' +
          '  html[data-theme="dark"]  audio-player,\n' +
          '  html[data-theme="dark"]  video-player { color-scheme: dark  !important; }\n' +
          '  html[data-theme="light"] audio-player,\n' +
          '  html[data-theme="light"] video-player { color-scheme: light !important; }\n' +
          '</style>';

          html = html.replace('</head>', styleBlock + '\n</head>');
          fs.writeFileSync('index.html', html);
          console.log('✓ Injected Video.js theme-fix before </head>');
          EOF

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild videojs player.js + inline + theme fix [skip ci]"
          file_pattern: "player.js index.html"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
