name: Build Video.js Bundle

on:
  
  workflow_dispatch:

permissions:
  contents: write                 # needed to push player.js back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install @videojs/html esbuild

      - name: Create Video.js entry file
        run: |
          cat > entry.js <<'EOF'
          // Video player + skin
          import '@videojs/html/video/player';
          import '@videojs/html/video/skin';

          // Audio player + skin
          import '@videojs/html/audio/player';
          import '@videojs/html/audio/skin';

          // Optional adapters
          // import '@videojs/html/media/hlsjs-video';
          // import '@videojs/html/media/hls-audio';
          EOF

      - name: Bundle with esbuild (inline sourcemap)
        run: |
          npx esbuild entry.js \
            --bundle \
            --format=esm \
            --minify \
            --sourcemap=inline \
            --outfile=public/player.js

      - name: Commit built player.js back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: build player.js [skip ci]"
          file_pattern: public/player.js
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
