          '  }\n' +
          '</style>';

          const blockRe = new RegExp(esc(MARKER) + '[\\s\\S]*?</style>');
          if (blockRe.test(html)) {
            html = html.replace(blockRe, styleBlock);
            console.log('✓ Updated glass UI (content + sidebar now translucent)');
          } else {
            html = html.replace('</head>', styleBlock + '\n</head>');
            console.log('✓ Injected glass UI');
          }
          fs.writeFileSync('index.html', html);
          EOF

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: .content + .sidebar now glass — real glass content-header [skip ci]"
          file_pattern: "player.js index.html"
          commit_user_name: github-actions[bot]
