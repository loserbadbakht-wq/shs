name: Build Video.js HTML Bundle & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install @videojs/html esbuild

      - name: Create Video.js entry file
        run: |
          cat > player.js <<'EOF'
          // Video player + skin
          import '@videojs/html/video/player';
          import '@videojs/html/video/skin';

          // Audio player + skin (default frosted look)
          import '@videojs/html/audio/player';
          import '@videojs/html/audio/skin';

          // Optional: use the neutral audio skin instead of the default
          // import '@videojs/html/audio/neutral-skin';

          // Optional: media adapters
          // import '@videojs/html/media/hlsjs-video';
          // import '@videojs/html/media/hls-audio';   // for HLS audio streams
          EOF

      - name: Bundle with esbuild (inline sourcemap)
        run: |
          npx esbuild player.js \
            --bundle \
            --format=esm \
            --minify \
            --sourcemap=inline \
            --outfile=public/player.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
